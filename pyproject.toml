# googly-vr — Poetry project.
#
# Deliberately the legacy [tool.poetry] layout (no [project] table): Poetry 2.x
# ignores path dependencies declared under [tool.poetry.dependencies] when a
# [project] table exists (a quirk the parent repo hit with `just init`), and
# this project needs the touchy-pad path dep to resolve. Swap the path dep for
# `touchy-pad = "^X"` from PyPI when googly-vr is extracted to its own repo.

[tool.poetry]
name = "googly-vr"
version = "0.1.0"
description = "Cute animated googly eyes on a touchy-pad USB display, driven by EyeTrackVR-style OSC eye tracking."
authors = ["Touchy-Pad contributors"]
license = "GPL-3.0-or-later"
readme = "README.md"
packages = [{ include = "googly_vr", from = "src" }]

[tool.poetry.dependencies]
# Match touchy-pad's supported range (>=3.11,<3.15) — it is a path dep.
python = ">=3.11,<3.15"
# OSC over UDP — both the sim-eyes broadcaster and the googly-vr listener.
python-osc = "^1.9"
# CLI framework (matches the touchy-pad host stack).
click = ">=8.1"
# The host library + screen DSL we render with. Path dep for now.
touchy-pad = { path = "../../app", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.8"

[tool.poetry.scripts]
sim-eyes = "googly_vr.sim_eyes:main"
googly-vr = "googly_vr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
